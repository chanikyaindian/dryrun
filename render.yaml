services:
  - type: web
    name: dryrun
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self'; worker-src 'none'; connect-src 'self' https://cdn.jsdelivr.net/pyodide/v0.26.4/full/; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /
        name: X-Frame-Options
        value: DENY
      - path: /index.html
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src 'self'; worker-src 'none'; connect-src 'self' https://cdn.jsdelivr.net/pyodide/v0.26.4/full/; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /index.html
        name: X-Frame-Options
        value: DENY
      - path: /python-runner.html
        name: Content-Security-Policy
        value: "frame-ancestors 'self'"
      - path: /python-runner.html
        name: X-Frame-Options
        value: SAMEORIGIN